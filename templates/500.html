{% extends "base.html" %}
{% block title %}Something went wrong — To My Love{% endblock %}
{% block content %}
<section class="section">
  <div class="container narrow">
    <div class="empty-state empty-state--page">
      <div class="empty-envelope" aria-hidden="true">
        <span class="ee-body"></span>
        <span class="ee-letter">!</span>
        <span class="ee-flap"></span>
      </div>
      <p class="eyebrow eyebrow--center">500</p>
      <h1>Something went a little sideways</h1>
      <p>It is not you — it is us. Please try again in a moment. Your words are safe.</p>
      <a href="{% url 'letters:home' %}" class="btn btn--primary">Back home</a>
    </div>
  </div>
</section>
{% endblock %}
